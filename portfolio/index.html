<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gynlee — 믿음을 주는 풀스택 개발자</title>
  <meta name="description" content="문제를 끝까지 이해하고 팀과 함께 성장하는 풀스택 개발자 Gynlee의 포트폴리오" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    /* ===== Ribbon & Pearl 디자인 토큰 ===== */
    :root {
      --surface: #FBF8F3;
      --surface-raised: #F4EEE4;
      --surface-tint: #F3E1DB;
      --hairline: #E3D9CB;
      --ink: #2A1E19;
      --ink-muted: #6B5D54;
      --ribbon: #A3202C;
      --ribbon-deep: #7A1620;
      --on-ribbon: #FFF8F2;
      --olive: #5E5E3E;
      --olive-tint: #E8E5D8;
      --olive-ink: #4A4A30;
      --gold: #B8955A;
      --pearl: #F7F1E6;
      --walnut: #2A1E19;

      --serif: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
      --sans: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

      --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px;
      --space-5: 40px; --space-6: 64px; --space-7: 96px;
      --radius-sm: 4px; --radius-md: 12px; --radius-pill: 999px;
      --shadow-soft: 0 1px 2px rgba(42,30,25,.06), 0 8px 24px rgba(42,30,25,.08);
      --max: 1100px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
    a { color: var(--ribbon); }
    a:hover { color: var(--ribbon-deep); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--ribbon); outline-offset: 2px; }
    h1, h2, h3, p { margin: 0; }
    .container { max-width: var(--max); margin: 0 auto; padding: 0 var(--space-4); }

    /* ===== 공통 ===== */
    .label { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; letter-spacing: .12em; color: var(--olive); text-transform: uppercase; }
    .label::before { content: ""; width: 24px; height: 1px; background: var(--gold); }
    .section { padding: var(--space-7) 0; }
    .section--raised { background: var(--surface-raised); border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
    .section-head { display: flex; flex-direction: column; gap: 12px; margin-bottom: var(--space-5); }
    .section-title { font-family: var(--serif); font-weight: 600; font-size: 36px; line-height: 1.35; }

    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px; border-radius: var(--radius-pill); font-weight: 500; font-size: 16px; text-decoration: none; transition: background .2s, border-color .2s; }
    .btn--primary { background: var(--ribbon); color: var(--on-ribbon); }
    .btn--primary:hover { background: var(--ribbon-deep); color: var(--on-ribbon); }
    .btn--ghost { border: 1px solid var(--hairline); color: var(--ink); }
    .btn--ghost:hover { border-color: var(--ink-muted); color: var(--ink); }

    .tag { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: var(--radius-sm); background: var(--olive-tint); color: var(--olive-ink); }

    /* ===== 헤더 ===== */
    header { border-bottom: 1px solid var(--hairline); background: rgba(251,248,243,.92); backdrop-filter: blur(6px); position: sticky; top: 0; z-index: 10; }
    nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 18px 0; }
    .logo { font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--ink); text-decoration: none; }
    .logo span { color: var(--ribbon); }
    .nav-links { display: flex; flex-wrap: wrap; gap: 28px; }
    .nav-links a { color: var(--ink-muted); text-decoration: none; font-size: 15px; }
    .nav-links a:hover { color: var(--ink); }

    /* ===== 히어로 ===== */
    .hero { padding: var(--space-7) var(--space-4); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); }
    .hero-text { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
    .hero h1 { font-family: var(--serif); font-weight: 600; font-size: 56px; line-height: 1.18; letter-spacing: -0.02em; }
    .hero h1 em { font-style: normal; color: var(--ribbon); }
    .hero-tagline { max-width: 540px; font-size: 18px; color: var(--ink-muted); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: var(--space-2); }
    .hero-art { flex: 1 1 320px; min-width: 0; display: flex; justify-content: center; }
    .hero-art svg { width: 100%; max-width: 380px; height: auto; }

    /* ===== About ===== */
    .about-body { display: flex; flex-direction: column; gap: var(--space-3); max-width: 760px; font-size: 17px; color: var(--ink-muted); }
    .about-body strong { color: var(--ink); font-weight: 700; }
    .about-body p:first-child { font-family: var(--serif); font-size: 24px; line-height: 1.6; color: var(--ink); }

    /* ===== Skills ===== */
    .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-3); }
    .skill-group { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: 12px; }
    .skill-group h3 { font-size: 16px; font-weight: 700; }
    .skill-items { display: flex; flex-wrap: wrap; gap: var(--space-2); }

    /* ===== Projects ===== */
    .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
    .card { background: var(--surface-raised); border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: 14px; transition: box-shadow .2s, transform .2s; }
    .card:hover { box-shadow: var(--shadow-soft); transform: translateY(-2px); }
    .card-num { font-family: var(--mono); font-size: 12px; color: var(--gold); letter-spacing: .12em; }
    .card h3 { font-size: 20px; font-weight: 700; line-height: 1.45; }
    .card-desc { font-size: 15px; color: var(--ink-muted); }
    .card-meta { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--hairline); font-size: 14px; }
    .card-meta dt { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--olive); }
    .card-meta dd { margin: 0 0 6px; color: var(--ink); }
    .card-links { display: flex; gap: var(--space-3); margin-top: auto; font-size: 15px; font-weight: 500; }

    /* ===== Contact ===== */
    footer { background: var(--walnut); color: var(--pearl); }
    .contact { padding: var(--space-7) 0 var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
    .contact .label { color: #CDB07A; }
    .contact-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--space-5); }
    .contact h2 { font-family: var(--serif); font-weight: 600; font-size: 40px; line-height: 1.35; }
    .contact-lead { color: #D9CEC2; margin-top: var(--space-3); }
    .contact-actions { display: flex; flex-direction: column; gap: 12px; min-width: 260px; }
    .btn--light { background: #E0565C; color: #1A1412; font-weight: 700; }
    .btn--light:hover { background: #F07A7E; color: #1A1412; }
    .btn--outline-light { border: 1px solid #6B5D54; color: var(--pearl); }
    .btn--outline-light:hover { border-color: var(--pearl); color: var(--pearl); }
    .copyright { padding-top: var(--space-4); border-top: 1px solid #4A3830; font-size: 13px; color: #B8AA9E; }

    /* ===== 모바일 ===== */
    @media (max-width: 720px) {
      .hero h1 { font-size: 38px; }
      .section-title { font-size: 28px; }
      .contact h2 { font-size: 30px; }
      .projects { grid-template-columns: 1fr; }
      .nav-links { gap: 18px; }
      .section { padding: var(--space-6) 0; }
      .hero { padding: var(--space-6) var(--space-4); }
      .contact-actions { min-width: 0; width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card, .btn { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav aria-label="주요 메뉴">
        <a class="logo" href="#top">Gynlee<span>.</span></a>
        <div class="nav-links">
          <a href="#about">소개</a>
          <a href="#skills">기술</a>
          <a href="#projects">프로젝트</a>
          <a href="#contact">연락하기</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="container hero">
      <div class="hero-text">
        <p class="label" id="hero-role"></p>
        <h1 id="hero-headline"></h1>
        <p class="hero-tagline" id="hero-tagline"></p>
        <div class="hero-actions">
          <a class="btn btn--primary" href="#projects">프로젝트 보기</a>
          <a class="btn btn--ghost" href="#contact">연락하기</a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <!-- 리본 레드 · 올리브 · 월넛 면 위에 진주 한 줄 -->
        <svg viewBox="0 0 380 420" xmlns="http://www.w3.org/2000/svg">
          <rect x="40" y="0" width="150" height="420" rx="12" fill="#A3202C"/>
          <rect x="190" y="0" width="150" height="230" rx="12" fill="#5E5E3E"/>
          <rect x="190" y="230" width="110" height="190" rx="12" fill="#2A1E19"/>
          <rect x="300" y="230" width="40" height="70" rx="6" fill="#B8955A"/>
          <rect x="0" y="300" width="40" height="120" rx="6" fill="#F3E1DB"/>
          <g fill="#F7F1E6">
            <circle cx="60" cy="150" r="10"/><circle cx="92" cy="170" r="10"/><circle cx="124" cy="186" r="10"/>
            <circle cx="156" cy="198" r="10"/><circle cx="188" cy="204" r="10"/><circle cx="220" cy="204" r="10"/>
            <circle cx="252" cy="198" r="10"/><circle cx="284" cy="186" r="10"/><circle cx="316" cy="170" r="10"/>
          </g>
          <circle cx="188" cy="236" r="14" fill="#F7F1E6"/>
        </svg>
      </div>
    </section>

    <section class="section section--raised" id="about">
      <div class="container">
        <div class="section-head">
          <p class="label">01 — About</p>
          <h2 class="section-title">이런 개발자입니다</h2>
        </div>
        <div class="about-body" id="about-body"></div>
      </div>
    </section>

    <section class="section" id="skills">
      <div class="container">
        <div class="section-head">
          <p class="label">02 — Skills</p>
          <h2 class="section-title">다룰 수 있는 기술</h2>
        </div>
        <div class="skills" id="skills-list"></div>
      </div>
    </section>

    <section class="section section--raised" id="projects">
      <div class="container">
        <div class="section-head">
          <p class="label">03 — Projects</p>
          <h2 class="section-title">함께, 또 혼자 끝까지 만든 것들</h2>
        </div>
        <div class="projects" id="projects-list"></div>
      </div>
    </section>
  </main>

  <footer id="contact">
    <div class="container contact">
      <p class="label">04 — Contact</p>
      <div class="contact-row">
        <div>
          <h2>함께 만들 웹이 있다면,<br>편하게 말씀해 주세요.</h2>
          <p class="contact-lead">채용 · 협업 · 커피챗 모두 환영합니다.</p>
        </div>
        <div class="contact-actions" id="contact-actions"></div>
      </div>
      <p class="copyright">© <span id="year"></span> Gynlee · Designed with Ribbon &amp; Pearl</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Hero
    document.getElementById("hero-role").textContent = DATA.hero.role;
    document.getElementById("hero-headline").innerHTML = DATA.hero.headline || esc(DATA.hero.name);
    document.getElementById("hero-tagline").textContent = DATA.hero.tagline;

    // About (data.js의 <strong> 강조를 그대로 사용)
    document.getElementById("about-body").innerHTML = DATA.about.map((p) => `<p>${p}</p>`).join("");

    // Skills
    document.getElementById("skills-list").innerHTML = DATA.skills.map((g) => `
      <div class="skill-group">
        <h3>${esc(g.category)}</h3>
        <div class="skill-items">${g.items.map((i) => `<span class="tag">${esc(i)}</span>`).join("")}</div>
      </div>`).join("");

    // Projects (최대 4개)
    document.getElementById("projects-list").innerHTML = DATA.projects.slice(0, 4).map((p, idx) => `
      <article class="card">
        <span class="card-num">${String(idx + 1).padStart(2, "0")}</span>
        <h3>${esc(p.name)}</h3>
        <p class="card-desc">${esc(p.desc)}</p>
        <div class="skill-items">${p.stack.map((s) => `<span class="tag">${esc(s)}</span>`).join("")}</div>
        <dl class="card-meta">
          <dt>ROLE</dt><dd>${esc(p.role)}</dd>
          <dt>RESULT</dt><dd>${esc(p.result)}</dd>
        </dl>
        <div class="card-links">
          ${p.github ? `<a href="${esc(p.github)}" target="_blank" rel="noopener">GitHub →</a>` : ""}
          ${p.demo ? `<a href="${esc(p.demo)}" target="_blank" rel="noopener">Demo →</a>` : ""}
        </div>
      </article>`).join("");

    // Contact
    const c = DATA.contact;
    document.getElementById("contact-actions").innerHTML = [
      c.email && `<a class="btn btn--light" href="mailto:${esc(c.email)}">이메일 보내기</a>`,
      c.github && `<a class="btn btn--outline-light" href="${esc(c.github)}" target="_blank" rel="noopener">GitHub</a>`,
      c.linkedin && `<a class="btn btn--outline-light" href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`,
    ].filter(Boolean).join("");

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
